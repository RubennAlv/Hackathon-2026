<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registro de negocio | NEX24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/design.css"><link rel="stylesheet" href="../css/registro.css">
</head>
<body>
<header class="nav" data-nex-navigation></header>
<main class="registration-page">
  <div class="registration-shell">
    <aside class="registration-aside">
      <small>ÚNETE A NEX24</small>
      <h1>Haz crecer tu negocio.</h1>
      <p>Crea una cuenta según tu operación y entra a una red de comercio local disponible las 24 horas.</p>
      <div class="registration-benefits">
        <div><span>1</span> Selecciona tu tipo de negocio</div>
        <div><span>2</span> Configura tu ubicación y catálogo</div>
        <div><span>3</span> Consulta ventas e inventario</div>
      </div>
    </aside>

    <section class="registration-form-card">
      <div class="role-switch" role="radiogroup" aria-label="Tipo de cuenta">
        <button class="role-option active" type="button" data-role="tiendita" role="radio" aria-checked="true">
          <strong>🛍️ Tiendita</strong><small>Venta directa y autoservicio</small>
        </button>
        <button class="role-option" type="button" data-role="proveedor" role="radio" aria-checked="false">
          <strong>🌱 Proveedor</strong><small>Productor o emprendedor local</small>
        </button>
      </div>

      <div id="registrationMessage" class="form-message" role="status"></div>
      <h2 id="formTitle">Datos de tu tiendita</h2>
      <form id="registrationForm">
        <input type="hidden" id="tipo" name="tipo" value="tiendita">
        <div class="form-grid">
          <div class="field"><label for="nombre">Nombre del negocio *</label><input id="nombre" name="nombre" required placeholder="Ej. Tienda El Centro"></div>
          <div class="field"><label for="responsable">Persona responsable *</label><input id="responsable" name="responsable" required placeholder="Nombre completo"></div>
          <div class="field"><label for="email">Correo electrónico *</label><input id="email" name="email" type="email" required placeholder="negocio@correo.com"></div>
          <div class="field"><label for="telefono">Teléfono *</label><input id="telefono" name="telefono" type="tel" required placeholder="618 000 0000"></div>
          <div class="field full"><label for="direccion">Dirección *</label><input id="direccion" name="direccion" required placeholder="Calle, número, colonia"></div>

          <div class="field conditional tiendita-fields visible"><label for="horario">Horario de atención</label><input id="horario" name="horario" placeholder="Ej. 24 horas"></div>
          <div class="field conditional tiendita-fields visible"><label for="zona">Zona o colonia</label><input id="zona" name="zona" placeholder="Ej. Zona Centro"></div>

          <div class="field conditional proveedor-fields"><label for="categoria">Categoría del producto</label><select id="categoria" name="categoria"><option value="">Selecciona una categoría</option><option>Alimentos</option><option>Bebidas</option><option>Granos y semillas</option><option>Dulces regionales</option><option>Artesanías</option></select></div>
          <div class="field conditional proveedor-fields"><label for="capacidad">Capacidad de suministro</label><input id="capacidad" name="capacidad" placeholder="Ej. 50 kg por semana"></div>
          <div class="field full conditional proveedor-fields"><label for="productos">Productos que ofrece</label><textarea id="productos" name="productos" placeholder="Describe tus productos"></textarea></div>

          <div class="field"><label for="password">Contraseña *</label><input id="password" name="password" type="password" minlength="6" required placeholder="Mínimo 6 caracteres"></div>
          <div class="field"><label for="passwordConfirm">Confirmar contraseña *</label><input id="passwordConfirm" type="password" minlength="6" required placeholder="Repite la contraseña"></div>
        </div>
        <button id="submitRegistration" class="submit-registration" type="submit">Crear cuenta de tiendita</button>
      </form>
    </section>
  </div>
</main>
<script src="../js/navigation.js"></script>
<script src="../js/registro.js"></script>
</body>
</html>
